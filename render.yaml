# Render Blueprint - deploys the voice agent as a free, persistent web service
# with native websocket support (required for Twilio Media Streams).
services:
  - type: web
    name: voice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Cloud uses pure-Python providers (no ffmpeg needed).
      - key: STT_PROVIDER
        value: deepgram
      - key: TTS_PROVIDER
        value: deepgram
      - key: TELEPHONY_PROVIDER
        value: twilio
      # Secrets - set these in the Render dashboard (sync:false = not in git).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: MY_VERIFIED_NUMBER
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      # Set to the service's own hostname after first deploy (optional; the app
      # falls back to the incoming Host header if blank).
      - key: PUBLIC_HOST
        sync: false
